# mdvn CI：构建 + 单元测试 + 性能门禁（M0 T16，M1 T44 扩展了 BENCH-B 内存门禁
# 与 run_fuzz.ps1 畸形语料门禁，两项都已并入 ci\check_budget.ps1 内部，
# 这里不需要拆成独立 job/step——check_budget.ps1 本身就是单一入口）。
#
# 说明：本 workflow 未在本机实际跑通（本机没有 GitHub Actions runner），
# 只做过 YAML 语法/字段结构的人工核对，实际生效情况需在真实 push/PR 时观察。
#
# ——— M3 T83：CI 上"记录不门禁"的项与原因（对齐 ci\check_budget.ps1 头部注释）———
# GitHub Actions 的 windows-latest 是无 GPU 虚拟机、性能波动大，以下几项在 CI 上
# 跑的是同一套脚本，但**已知会比本机结果更不稳定**，不通过就意味着要重跑/人工复核，
# 不代表代码退化：
#   ① 暖启动首屏（01§4 第1行）：check_budget.ps1 默认口径已经用"上限值 120ms"
#      而不是"目标值 60ms"做硬性判据（见脚本头部"本机门禁 vs CI 门禁"一节），
#      这条在 CI 虚拟机上依然可能偶发超过 120ms——如果发生，先看是不是 CI
#      runner 当次分配的物理核心被邻居虚拟机抢占，不要直接当成代码回归。
#   ② 滚动帧率（01§4 第6行）：门禁走的是"口径①"（mdvn 自身重绘耗时的
#      frame_total_p50_ms 换算 FPS），不依赖 GPU/DWM/ETW，理论上比 PresentMon
#      口径对 CI 虚拟机更友好，但仍可能因为 CPU 争抢而偏高——同样先怀疑环境。
#   ③ BENCH-D（10MB 文档）首屏（01§4 第7行）：同①，虚拟机 CPU 单核性能通常
#      弱于本机，目标值 1.5s 的余量（本机实测 ~90ms）理论上够用，但没有在真实
#      GitHub Actions runner 上跑过，需观察首次真实 push/PR 的结果。
#   ④ BENCH-C（高亮最坏情况语料）：01/04 都没有为它定线，check_budget.ps1
#      本身就只记录不设门禁（不是 CI 特例，本机跑也一样不设门禁）。
# 不采用的方案：**不会**为了让 CI 变绿而统一放宽阈值——那样会让门禁失去意义
# （08-m3-tasks.md T83 明文禁止）。真正需要区分本机/CI 两套阈值时，用
# check_budget.ps1 的 -Strict 开关（当前只影响暖启动与 leak_probe 两项的
# 判据严格度，见脚本内注释），而不是在这个 workflow 文件里维护第二套数字。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-check-budget:
    # mdvn 是 Win32 桌面应用，必须在 Windows runner 上构建。
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装/校验 CMake
        uses: lukka/get-cmake@latest

      # windows-latest 镶像自带 Visual Studio 2022 Build Tools，
      # 这里显式设置 MSVC 开发者命令行环境，保证 cl.exe/link.exe 在 PATH 中。
      - name: 配置 MSVC 开发者命令行环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 缓存 CMake 配置产物 + 编译中间对象:check_budget.ps1 内部按
      # Test-Path $exePath 判断是否需要重建,命中缓存时直接跳过整个构建段,
      # 不用每次从零重装/重编 third_party/lunasvg+plutovg+md4c 这类基本
      # 不变的 vendored 源码。key 按 CMakeLists/源码内容哈希。
      #
      # 拆成 restore(这里)+ save(check_budget.ps1 那一步之后、带
      # if: success())两步,理由同 release.yml 同一处改动:一体式
      # actions/cache 会在门禁失败时仍把"坏"build 目录存回缓存,污染下次
      # restore-keys 前缀回退的命中结果。restore-keys 前缀回退命中生成器
      # 不匹配的陈旧缓存这条风险,由 check_budget.ps1 内新加的"CMakeCache.txt
      # 生成器不符就整目录删掉重配"兜底。
      #
      # Cache the CMake configure output + compiled objects: check_budget.ps1
      # decides whether a rebuild is needed via Test-Path $exePath, so a
      # cache hit skips the whole build section instead of reinstalling and
      # recompiling the largely-static vendored third_party/lunasvg+plutovg+
      # md4c source from scratch every run. Key is hashed from CMakeLists/
      # source content.
      #
      # Split into restore (here) + save (after the check_budget.ps1 step,
      # gated on if: success()), same reasoning as the release.yml change:
      # the single-step actions/cache form would save a "bad" build dir back
      # even when the budget gate fails, poisoning the next restore-keys
      # prefix fallback. The generator-mismatch risk from that prefix
      # fallback is covered by the "delete-and-reconfigure if CMakeCache.txt
      # generator doesn't match" guard newly added inside check_budget.ps1.
      - name: 恢复构建目录缓存 / Restore build directory cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: ci-build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt', 'tests/CMakeLists.txt', 'third_party/**', 'src/**', 'tests/**') }}
          restore-keys: |
            ci-build-${{ runner.os }}-

      # ci/check_budget.ps1 内部会在构建产物缺失时自动执行
      # cmake -S . -B build -G "Ninja Multi-Config" 与
      # cmake --build build --config Release，因此这里不单独拆分构建步骤。
      # 不写死 VS 版本号生成器、改用 Ninja Multi-Config 的理由见脚本内注释
      # (windows-latest 镜像 VS 版本会不定期升级)。
      #
      # check_budget.ps1 现在是覆盖 01§4 全部 8 行硬指标 + M1/M2 既有门禁的
      # 单一入口（M3 T83），CI 侧不新增独立 job/step——拆分反而会让"任一项
      # 失败即整体失败"这条语义在两处维护。不加 -Strict：CI 上暖启动用上限值
      # 判据、leak_probe 的已知"一次性预热"降级为提示，理由见本文件顶部注释
      # 与 ci\check_budget.ps1 脚本头部注释。
      #
      # shell 用 pwsh(PowerShell 7,windows-latest 预装)而不是 powershell
      # (Windows PowerShell 5.1):check_budget.ps1 无 BOM 的 UTF-8 源码文件
      # 含中文注释/字符串,5.1 在无 BOM 时按系统 ANSI 代码页读取源码文件,
      # 中文字节序列被错误解码成乱码,进而破坏脚本的整体语法解析(实测报
      # "Unexpected token"/"reserved for future use"等一堆解析错误,不是
      # 逻辑 bug,是编码问题)。pwsh 默认按 UTF-8(无 BOM 也一样)读源码,
      # 不需要改动脚本文件本身加 BOM。
      - name: 运行性能门禁脚本（构建 + 单测 + 01§4 全部硬指标门禁）
        shell: pwsh
        run: |
          .\ci\check_budget.ps1 -N 20

      # 2026-09-19 内存调研第一条建议:排查 private_bytes 超标前先知道
      # "钱花哪了"，不盲改代码。纯诊断,不设门禁,cdb.exe(Windows SDK 可选
      # 组件)在 runner 上不一定存在——脚本内部会优雅跳过并提示，本步骤
      # 永远不影响 job 成败(if: always()，即便上面门禁失败也想看内存构成)。
      #
      # 2026-09-19 memory investigation's first recommendation: know where
      # the money went before blindly changing code. Pure diagnostics, no
      # gate; cdb.exe (an optional Windows SDK component) may not exist on
      # the runner — the script itself skips gracefully with a notice. This
      # step never affects job success/failure (if: always(), so we still
      # want the memory breakdown even when the budget gate above failed).
      - name: 内存构成诊断(cdb !address -summary,纯记录) / Memory breakdown diagnostic
        if: always()
        shell: pwsh
        run: |
          .\ci\memory_breakdown.ps1

      # 只在门禁通过后才把 build 目录存回缓存(if: success()),理由见上面
      # 恢复步骤的注释。
      #
      # Only save the build dir back to the cache after the budget gate
      # passes (if: success()); see the restore step's comment above.
      - name: 保存构建目录缓存 / Save build directory cache
        if: success() && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
