# mdvn 单文件 Release 构建 workflow。
#
# 与 ci.yml 的分工:ci.yml 管"每次 push/PR 的性能门禁"(01§4 全部硬指标),
# 本文件只管"产出一份可下载的单文件 exe 发布物",复用已有的
# ci\verify_release.ps1 做验收(不加壳/不压缩、无 CRT 动态依赖、WINDOWS
# 子系统、LICENSE/THIRD-PARTY-NOTICES 打包清单),不重复定义第二套判据。
#
# Single-file mdvn.exe release build workflow.
#
# Division of labor vs ci.yml: ci.yml owns the per-push/PR performance
# budget gate (all hard metrics in 01§4); this file only produces a
# downloadable single-file exe artifact, reusing the existing
# ci\verify_release.ps1 for verification (no packer/compression, no CRT
# DLL dependency, WINDOWS subsystem, LICENSE/THIRD-PARTY-NOTICES packaging
# manifest) rather than defining a second set of criteria.
name: Release

# 用户裁决(2026-09-19):源码推送到 master 即自动构建并发布,不要求先手动
# 打 version tag。采用"latest"滚动发布——每次触发都覆盖同一个 tag/Release
# 的产物,不为每次推送保留独立历史版本(需要历史版本时改用手动打 tag,
# workflow_dispatch 仍保留作为手动重跑入口)。paths 过滤跳过纯文档/图片/
# 产物类改动,与全局 CLAUDE.md 里 commit 前 code-review 的"源码范围判断"
# 同一条原则:不产源码变化就不重新构建发布。
#
# User decision (2026-09-19): pushing source to master auto-builds and
# publishes, no manual version tag required first. Uses a rolling "latest"
# release — every trigger overwrites the same tag/Release's assets rather
# than keeping a separate historical version per push (use a manual tag for
# that instead; workflow_dispatch stays as a manual re-run entry point). The
# paths filter skips pure doc/image/artifact-only changes, same "is this a
# source change" principle as the pre-commit code-review gate in the global
# CLAUDE.md — no source change, no rebuild-and-republish.
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "tests/CMakeLists.txt"
      - "ci/verify_release.ps1"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.md"
      - ".github/workflows/release.yml"
  workflow_dispatch: {}

# GitHub Release 创建/上传附件需要 contents:write。
#
# Creating a GitHub Release and uploading its assets needs contents:write.
permissions:
  contents: write

jobs:
  build-release-exe:
    # mdvn 是 Win32 桌面应用,必须在 Windows runner 上构建。
    #
    # mdvn is a Win32 desktop app; must build on a Windows runner.
    runs-on: windows-latest

    steps:
      - name: 拉取代码 / Checkout
        uses: actions/checkout@v4

      - name: 安装/校验 CMake / Set up CMake
        uses: lukka/get-cmake@latest

      - name: 配置 MSVC 开发者命令行环境 / Set up MSVC dev command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Release 配置已在根 CMakeLists.txt 里固定为"内存占用优先"策略
      # (/O1 体积最小化预设 + /GL /Gy /Gw + /OPT:REF /OPT:ICF /LTCG),
      # 本步骤不重复传编译选项,避免这里与源码里的设置产生第二份定义、
      # 后续改一处漏改另一处。
      #
      # The Release config already bakes in the "memory footprint first"
      # policy in the root CMakeLists.txt (/O1 minimize-size preset +
      # /GL /Gy /Gw + /OPT:REF /OPT:ICF /LTCG). This step does not pass
      # extra compile options, to avoid a second source of truth that can
      # drift from the one in CMakeLists.txt.
      # 缓存 CMake 配置产物 + 编译中间对象(third_party/lunasvg+plutovg+md4c
      # 这类基本不变的 vendored 源码,每次从零编译最费时间):key 按
      # CMakeLists/源码内容哈希,命中时增量编译,不用每次全量重装/重建依赖。
      # third_party/** 加进 key 是因为 vendored 库版本升级也要让缓存失效。
      #
      # 拆成 restore(这里)+ save(job 末尾、且带 if: success())两步,不用
      # 一体式 actions/cache——一体式的话即使后面构建/验收失败,post-step
      # 仍会照常把这份"坏"build 目录存回缓存,下次 restore-keys 前缀回退时
      # 就会捞到一份没通过验收的产物当"命中"复用。restore-keys 前缀回退本身
      # 也可能捞到生成器不匹配的陈旧缓存,这条由 check_budget.ps1/run_fuzz.ps1/
      # verify_assoc.ps1 里新加的"CMakeCache.txt 生成器不符就整目录删掉重配"
      # 兜底(本文件的构建路径同样先过 cmake -S ... -G "Ninja Multi-Config"
      # 的显式配置步骤,不依赖那三个脚本的兜底逻辑,但 restore-keys 命中同一
      # 风险仍然存在,所以 save 才要求 success())。
      #
      # Cache the CMake configure output + compiled objects (recompiling
      # the largely-static vendored third_party/lunasvg+plutovg+md4c source
      # from scratch is the slow part every run): key is hashed from
      # CMakeLists/source content so a cache hit gives an incremental build
      # instead of reinstalling/rebuilding everything each time. third_party/**
      # is in the key so a vendored library bump still invalidates it.
      #
      # Split into restore (here) + save (end of job, gated on if: success())
      # instead of the single-step actions/cache — with the single-step form,
      # even a failed build/verify still gets its "bad" build dir saved back
      # by the post-step, so the next restore-keys prefix fallback could pick
      # up an unverified artifact as a "hit". The prefix fallback can also
      # restore a build dir configured with a stale/mismatched generator;
      # that risk is covered by the "delete-and-reconfigure if CMakeCache.txt
      # generator doesn't match" guard newly added to check_budget.ps1/
      # run_fuzz.ps1/verify_assoc.ps1 (this workflow's own build path already
      # runs an explicit cmake -S ... -G "Ninja Multi-Config" configure step
      # below and doesn't depend on those scripts' guard, but the same
      # restore-keys risk exists here too, which is why save still requires
      # success()).
      - name: 恢复构建目录缓存 / Restore build directory cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: release-build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/CMakeLists.txt', 'tests/CMakeLists.txt', 'third_party/**', 'src/**', 'tests/**') }}
          restore-keys: |
            release-build-${{ runner.os }}-

      # 不写死 VS 版本号生成器("Visual Studio 17 2022"):windows-latest 镜像
      # 的 VS 版本会不定期升级(2026-09-19 观测到已是 VS 18),硬编码 17 会在
      # 镜像升级后直接报"could not find any instance of Visual Studio"退出。
      # 改用 "Ninja Multi-Config"——不依赖任何 VS 生成器命名/版本探测,只需要
      # cl.exe/link.exe 在 PATH 里(msvc-dev-cmd 已经配置好),产出的多配置
      # 目录结构(build\src\Release\...)与原 VS 生成器完全一致,不影响本
      # workflow 后续按 build\src\Release\mdvn.exe 取产物的路径假设。本机
      # 实测过(2026-09-19):同一份源码配置+构建 mdvn.exe 成功,产物落在
      # build\src\Release\mdvn.exe,与切换前路径一致。
      #
      # Don't pin the generator version ("Visual Studio 17 2022"): the
      # windows-latest image's VS version bumps periodically (already VS 18
      # as of 2026-09-19); a hardcoded 17 fails with "could not find any
      # instance of Visual Studio" once the image moves on. Switched to
      # "Ninja Multi-Config" instead — no dependency on VS generator
      # naming/version detection, only needs cl.exe/link.exe on PATH
      # (already set up by msvc-dev-cmd). Its multi-config output layout
      # (build\src\Release\...) matches the old VS generator exactly, so
      # this workflow's downstream build\src\Release\mdvn.exe path
      # assumption is unaffected. Verified locally (2026-09-19): configuring
      # and building mdvn.exe from the same source succeeds, landing at the
      # same build\src\Release\mdvn.exe path as before the switch.
      # 防御:restore-keys 前缀回退可能恢复出一份用旧生成器("Visual Studio
      # 17 2022")配置过的 build 目录(比如切到 Ninja Multi-Config 之前的
      # 缓存条目)。若不做这层判断就直接 cmake -B 复用该目录,CMake 会因
      # 生成器不匹配报错退出——整个目录删了重配,理由同 ci\check_budget.ps1
      # 同一处改动。
      #
      # Defense: the restore-keys prefix fallback may restore a build dir
      # configured with the old "Visual Studio 17 2022" generator (a cache
      # entry saved before the Ninja Multi-Config switch). Reusing it as-is
      # makes CMake fail with a generator mismatch — delete and reconfigure,
      # same reasoning as the ci\check_budget.ps1 change.
      - name: 校验构建目录缓存的生成器 / Validate cached build dir generator
        shell: pwsh
        run: |
          $cacheFile = "build\CMakeCache.txt"
          if ((Test-Path $cacheFile) -and
              -not (Select-String -Path $cacheFile -Pattern '^CMAKE_GENERATOR:INTERNAL=Ninja Multi-Config$' -Quiet)) {
            Write-Host "检测到 build 是用其他生成器配置的(可能是陈旧缓存)，删除后重新配置。"
            Remove-Item -Recurse -Force build
          }

      - name: 配置 / Configure (CMake, Release)
        shell: pwsh
        run: cmake -S . -B build -G "Ninja Multi-Config"

      - name: 构建 / Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --target mdvn

      - name: 跑单元测试 / Run unit tests
        shell: pwsh
        run: |
          cmake --build build --config Release --target mdvn_tests
          .\build\tests\Release\mdvn_tests.exe

      # 复用既有验收脚本:不加壳/不压缩声明性检查、无 CRT 动态依赖、
      # WINDOWS 子系统、体积记录、LICENSE/THIRD-PARTY-NOTICES 打包清单、
      # 子进程数恒为 0。失败即整个 job 失败,不允许发布不合格产物。
      #
      # Reuse the existing verification script: no-packer declaration
      # check, no CRT DLL dependency, WINDOWS subsystem, size record,
      # LICENSE/THIRD-PARTY-NOTICES packaging manifest, zero subprocess
      # count. Any failure fails the whole job — no shipping a
      # non-conforming artifact.
      - name: 验收产物 / Verify release artifact
        shell: pwsh
        run: .\ci\verify_release.ps1

      # 只在验收通过后才把 build 目录存回缓存(if: success()):避免把一份
      # 没通过验收的构建结果标记成"命中"存进去,污染下次 restore-keys。
      #
      # Only save the build dir back to the cache after verification passes
      # (if: success()): avoids writing back a build that failed
      # verification, which would poison the next restore-keys lookup.
      - name: 保存构建目录缓存 / Save build directory cache
        if: success() && steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}

      - name: 上传单文件 exe / Upload single-file exe
        uses: actions/upload-artifact@v4
        with:
          name: mdvn-exe
          path: build\src\Release\mdvn.exe
          if-no-files-found: error

      - name: 上传发布包(exe+LICENSE+THIRD-PARTY-NOTICES) / Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: mdvn-release-zip
          path: bench\artifacts\mdvn-release.zip
          if-no-files-found: error

      # 发布/更新"latest"滚动 Release:tag_name 固定为 latest,softprops/
      # action-gh-release 找不到这个 tag 时会在当前 commit 上新建它,已存在
      # 时把它移到当前 commit 并把新产物追加/覆盖进同一个 Release——用户
      # 始终从同一个固定链接(.../releases/tag/latest)下载到最新构建,不需要
      # 每次去找新 tag。body 里写清楚对应的源码 commit,而不是每次自动生成
      # 一份变更日志(那是"保留历史版本"策略才需要的东西,滚动发布不需要)。
      #
      # Publish/update the rolling "latest" Release: tag_name is fixed to
      # `latest`; softprops/action-gh-release creates that tag on the current
      # commit if it doesn't exist yet, or moves it forward and
      # replaces/adds assets on the same Release if it already does — users
      # always download the newest build from one stable link
      # (.../releases/tag/latest) without hunting for a new tag each time.
      # The body just records which source commit this build came from,
      # rather than auto-generating a changelog every run (that belongs to
      # a keep-history-per-push strategy, which this rolling release isn't).
      - name: 发布/更新 latest 滚动 Release / Publish/update rolling latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: mdvn (latest build)
          body: |
            自动滚动构建,对应源码 commit: ${{ github.sha }}

            Automatically updated rolling build, built from source commit ${{ github.sha }}.
          make_latest: true
          files: |
            build\src\Release\mdvn.exe
            bench\artifacts\mdvn-release.zip
