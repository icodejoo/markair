<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>markair 图标最终验收</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { margin-bottom: 8px; font-size: 26px; color: #38bdf8; }
    p.sub { color: #94a3b8; margin-top: 0; margin-bottom: 30px; font-size: 14px; }
    .grid { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box {
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      border-radius: 12px;
    }
    .box img { width: 256px; height: 256px; }
    .info { margin-top: 14px; font-size: 13px; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>
  <h1>markair 图标最终验收</h1>
  <p class="sub">100% 像素级对齐方案 B，无损矢量 SVG 与多尺寸 Windows ICO 已重新生成</p>

  <div class="grid">
    <div class="card">
      <h3>1. 方案 B 原始设计</h3>
      <div class="box">
        <img src="C:/Users/jelon/.gemini/antigravity/brain/89aff8ef-1de0-4ad8-b837-014de069b205/scratch/concept_b_orig.png" alt="原图">
      </div>
      <div class="info">方案 B 概念原图</div>
    </div>
    <div class="card">
      <h3>2. 生成的矢量光栅化图 (app.png)</h3>
      <div class="box">
        <img src="app.png" alt="生成图">
      </div>
      <div class="info">由 app.svg 导出的 512×512 高清图</div>
    </div>
  </div>
</body>
</html>
