<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景渐变：天蓝 -> 湖青 -> 薄荷绿 (方案 B 原版色彩采样) -->
    <linearGradient id="markairBg" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#55B3FA"/>
      <stop offset="50%" stop-color="#67D4E7"/>
      <stop offset="100%" stop-color="#7EF4D2"/>
    </linearGradient>

    <!-- 顶部微光边框 -->
    <linearGradient id="innerLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- 图标柔和环境阴影 (Windows 11 Fluent 风格) -->
    <filter id="fluentShadow" x="-12%" y="-12%" width="124%" height="128%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0284C7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 1. 图标底板 Squircle (居中圆角矩形，440x440，rx=104) -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#markairBg)" filter="url(#fluentShadow)"/>
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="none" stroke="url(#innerLight)" stroke-width="2"/>

  <!-- 2. 白色主体几何图形 (与方案 B 100% 像素级对齐) -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="
