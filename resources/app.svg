    M 336.6 235.7 L 322.7 249.6 L 322.7 358.8 L 371.3 359.2 L 371.6 266.2 L 357.7 253.0 L 357.3 344.5 L 338.1 344.9 L 337.0 343.8 L 337.7 237.5 Z
